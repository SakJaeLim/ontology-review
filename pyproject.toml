[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-evidence-review"
version = "0.1.0"
description = "An offline source revision and SHACL review sidecar for LLM Wiki"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["rdflib==7.6.0", "pyshacl==0.40.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
evidence-wiki = "evidence_wiki.__main__:main"

[tool.setuptools.packages.find]
include = ["evidence_wiki*"]

[tool.setuptools.package-data]
evidence_wiki = ["design/*.css", "design/*.svg", "design/LICENSE.*", "web/*.html", "web/*.js", "web/*.css", "web/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
